<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#26332e">
    <title>Chatbot AI</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="chat-card" aria-label="Chatbot AI">
        <header class="chat-header">
            <div class="brand-mark" aria-hidden="true">AI</div>
            <div class="header-copy">
                <h1>Chatbot AI</h1>
                <p>NVIDIA Nemotron 3 Ultra</p>
            </div>
            <div class="header-status"><span aria-hidden="true"></span>Siap</div>
        </header>

        <section class="chat-messages" id="chatMessages" aria-live="polite" aria-label="Percakapan">
            <div class="message message-assistant">Halo! Ada yang bisa saya bantu?</div>
        </section>

        <form class="chat-form" id="chatForm">
            <label class="visually-hidden" for="messageInput">Ketik pesan</label>
            <textarea
                id="messageInput"
                name="message"
                placeholder="Ketik pesan..."
                rows="1"
                required
            ></textarea>
            <button type="submit" id="sendButton" aria-label="Kirim pesan">
                <span>Kirim</span>
                <svg aria-hidden="true" viewBox="0 0 24 24">
                    <path d="M4 12h15m-6-6 6 6-6 6"></path>
                </svg>
            </button>
        </form>
    </main>
</body>
</html>
